name: api-sentinel

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api-sentinel-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=API Sentinel
      - APP_VERSION=0.3.0
      - DEBUG=false
      - DATABASE_URL=sqlite:////app/data/sentinel.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-insecure_development_secret_change_in_production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80,http://localhost:5173,http://127.0.0.1:3000
      - DEFAULT_CHECK_INTERVAL_SECONDS=60
      - DEFAULT_CHECK_TIMEOUT_SECONDS=30
      - INCIDENT_THRESHOLD_FAILURES=3
      - INCIDENT_RECOVERY_THRESHOLD=3
      - SEED_SAMPLE_USERS=true
    volumes:
      - sentinel_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: api-sentinel-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sentinel_data:
    name: api_sentinel_data
