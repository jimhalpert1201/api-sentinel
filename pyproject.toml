[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"backend/alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_default_fixture_loop_scope = "function"

