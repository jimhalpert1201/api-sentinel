name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-ci:
    name: Backend Lint, Test & Migrations
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "sqlite:///./ci_test.db"
      PYTHONPATH: "backend"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check backend

      - name: Run Ruff Formatter Check
        run: |
          ruff format --check backend

      - name: Run Pytest Suite with Coverage
        run: |
          pytest --cov=backend/app --cov-report=term-missing --cov-report=xml backend/tests

      - name: Verify Alembic Migrations
        run: |
          cd backend
          alembic upgrade head

  frontend-ci:
    name: Frontend Lint, TypeCheck & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend dependencies
        run: |
          npm ci

      - name: TypeScript Compilation & Vite Build
        run: |
          npm run build

  ci-gate:
    name: CI Merge Gate & Summary
    needs: [backend-ci, frontend-ci]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate CI Summary Report
        run: |
          echo "## 🛡️ CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|:---:|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Ref** | \`${{ github.base_ref || github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend (Python 3.13, Ruff, Pytest, Alembic)** | ${{ needs.backend-ci.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend (Node 20, TypeScript, Vite Build)** | ${{ needs.frontend-ci.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.backend-ci.result }}" = "success" ] && [ "${{ needs.frontend-ci.result }}" = "success" ]; then
            echo "### 🟢 VERDICT: ALL QUALITY GATES PASSED — SAFE TO MERGE" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🔴 VERDICT: QUALITY GATES FAILED — MERGE BLOCKED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
