name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-and-lint:
    name: Lint, Test & Verify Migrations
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "sqlite:///./ci_test.db"
      PYTHONPATH: "backend"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check backend

      - name: Run Ruff Formatter Check
        run: |
          ruff format --check backend

      - name: Run Pytest Suite with Coverage
        run: |
          pytest --cov=backend/app --cov-report=term-missing --cov-report=xml backend/tests

      - name: Verify Alembic Migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Generate CI Summary Report
        if: always()
        run: |
          echo "## 🛡️ CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|:---:|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Branch** | \`${{ github.base_ref || github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Python Version** | 3.13 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ruff Linting** | ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pytest & Coverage** | ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Database Migrations** | ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "### 🟢 VERDICT: SAFE TO MERGE" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🔴 VERDICT: NOT SAFE TO MERGE" >> $GITHUB_STEP_SUMMARY
          fi
